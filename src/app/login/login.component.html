<div class="login-container">
  <div class="login-left">
    <img class="logo" src="assets\l.png" alt="logo" >
  </div>
  <div class="login-right">
    <h2>Login</h2>
    <div class="login-form">
      <label for="email">Email :</label>
      <input  id="email" [(ngModel)]="email" placeholder="Entrez votre email" required>

      <label for="password">Mot de passe :</label>
      <input type="password" id="password" [(ngModel)]="password" placeholder="Entrez votre mot de passe" required>

      <button  (click)="onLogin()"  >Se connecter</button>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
    </div>
  </div>
</div>
