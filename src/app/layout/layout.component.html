<nz-layout class="layout">
  <nz-sider nzCollapsible nzBreakpoint="lg" [nzCollapsedWidth]="0">
    <div class="logo"></div>
    <ul nz-menu nzTheme="dark" nzMode="inline">
      <li nz-menu-item>
        <nz-icon nzType="user"/>
        <a routerLink="/home">🏠 Accueil</a>

      </li>
      <li nz-menu-item>
        <nz-icon nzType="user"/>
        <a routerLink="/superviseur">👨‍💼 Gestion des superviseurs</a>
      </li>
      <li nz-menu-item>
        <nz-icon nzType="user"/>
        <a routerLink="/conducteur">🚗 Gestion des conducteurs</a>
      </li>
      <li nz-menu-item>
        <nz-icon nzType="user"/>
        <a routerLink="/vehicule"> 🚗 Gestion des Véhicules </a>
      </li>
    </ul>
  </nz-sider>
  <nz-layout>

    <nz-header>
      <div class="header-container">
        <div class="periode" *ngIf="isMapRoute()">
          <label for="period">Période :</label>
          <nz-select
            id="period"
            style="width: 160px; margin-left: 8px;"
            [(ngModel)]="selectedPeriod"
            (ngModelChange)="onPeriodChange($event)"
            nzAllowClear
            nzPlaceHolder="Choisir une période"
          >
            <nz-option nzValue="today" nzLabel="Aujourd'hui"></nz-option>
            <nz-option nzValue="yesterday" nzLabel="Hier"></nz-option>
            <nz-option nzValue="this_week" nzLabel="Cette semaine"></nz-option>
            <nz-option nzValue="last_week" nzLabel="La semaine dernière"></nz-option>
            <nz-option nzValue="this_month" nzLabel="Ce mois-ci"></nz-option>
            <nz-option nzValue="last_month" nzLabel="Le mois dernier"></nz-option>
            <nz-option nzValue="custom" nzLabel="Personnalisé"></nz-option>
          </nz-select>

          <nz-date-picker
            *ngIf="selectedPeriod === 'custom'"
            [(ngModel)]="startDate"
            [nzFormat]="'yyyy-MM-dd'"
            [nzPlaceHolder]="'Date de début'"
            (ngModelChange)="onCustomDateSelected()"
          ></nz-date-picker>

          <nz-date-picker
            *ngIf="selectedPeriod === 'custom'"
            [(ngModel)]="endDate"
            [nzFormat]="'yyyy-MM-dd'"
            [nzPlaceHolder]="'Date de fin'"
            (ngModelChange)="onCustomDateSelected()"
          ></nz-date-picker>

        </div>


        <div class="user-info">
          <nz-avatar nzIcon="user" (click)="handleUserIconClick()"></nz-avatar>
          <span>{{ userName }}</span>
          <button *ngIf="showLogout" nz-button nzType="default" (click)="logout()">Se déconnecter</button>
        </div>
      </div>
    </nz-header>

    <nz-content>
      <div class="inner-content">
       <router-outlet></router-outlet>
      </div>

    </nz-content>
    <nz-footer>© 2025 Rapide Poste . Tous droits réservés.</nz-footer>
  </nz-layout>
</nz-layout>
