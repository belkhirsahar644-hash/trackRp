<nz-layout class="layout">

  <nz-sider class="custom-sider" nzCollapsible nzBreakpoint="lg" [nzCollapsedWidth]="0">
    <div class="logo">
  <img src="assets/l.jpg" alt="Logo La Poste" class="poste-logo" />
</div>

    <ul nz-menu nzTheme="dark" nzMode="inline">

      <li nz-menu-item>
        <nz-icon nzType="home" nzTheme="outline" />
        <a routerLink="/home"> Accueil</a>

      </li>
      <li nz-menu-item *ngIf="authentificationsService.getUser()?.administrator">
        <nz-icon nzType="team" nzTheme="outline" />
        <a routerLink="/superviseur"> Gestion des superviseurs</a>
      </li>

      <li nz-menu-item  *ngIf="authentificationsService.getUser()?.administrator">
        <nz-icon nzType="team" nzTheme="outline" />
        <a routerLink="/conducteur"> Gestion des conducteurs</a>
      </li>

      <li nz-menu-item *ngIf="authentificationsService.getUser()?.administrator || authentificationsService.getUser()?.supervisor">
        <nz-icon nzType="mobile" nzTheme="outline" />
        <a routerLink="/vehicule">  Gestion des appareils </a>
      </li>

      <li nz-menu-item *ngIf="authentificationsService.getUser()?.administrator">
        <nz-icon nzType="bell" />
        <a routerLink="/notif">  Gestion des Notifications</a>
      </li>

      <li nz-menu-item *ngIf="authentificationsService.getUser()?.driver"  >
        <nz-icon nzType="bar-chart" nzTheme="outline" />
        <a (click)="goToDriverHistory()" >  Historique</a>
      </li>



    </ul>
  </nz-sider>

  <nz-layout>

    <nz-header>
      <div class="header-container">

        <div class="periode" *ngIf="isMapRoute()">
          <label for="period">Période :</label>
          <nz-select
            id="period"
            style="width: 160px; margin-left: 8px;"
            [(ngModel)]="selectedPeriod"
            (ngModelChange)="onPeriodChange($event)"
            nzAllowClear
            nzPlaceHolder="Choisir une période"
          >
            <nz-option nzValue="today" nzLabel="Aujourd'hui"></nz-option>
            <nz-option nzValue="yesterday" nzLabel="Hier"></nz-option>
            <nz-option nzValue="this_week" nzLabel="Cette semaine"></nz-option>
            <nz-option nzValue="last_week" nzLabel="La semaine dernière"></nz-option>
            <nz-option nzValue="this_month" nzLabel="Ce mois-ci"></nz-option>
            <nz-option nzValue="last_month" nzLabel="Le mois dernier"></nz-option>
            <nz-option nzValue="custom" nzLabel="Personnalisé"></nz-option>
          </nz-select>

          <nz-date-picker
            *ngIf="selectedPeriod === 'custom'"
            [(ngModel)]="startDate"
            [nzFormat]="'yyyy-MM-dd'"
            [nzPlaceHolder]="'Date de début'"
            (ngModelChange)="onCustomDateSelected()"
          ></nz-date-picker>

          <nz-date-picker
            *ngIf="selectedPeriod === 'custom'"
            [(ngModel)]="endDate"
            [nzFormat]="'yyyy-MM-dd'"
            [nzPlaceHolder]="'Date de fin'"
            (ngModelChange)="onCustomDateSelected()"
          ></nz-date-picker>

        </div>
        <div class="right-section">
          <button
            class="btn btn-light position-relative notifiction-list"
            nz-dropdown
            [nzDropdownMenu]="notificationMenu"
            nzTrigger="click"
          >
            <nz-icon nzType="bell" />
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              *ngIf="notifications.length > 0"
            >
        {{ notifications.length }}
      </span>
          </button>

          <nz-dropdown-menu #notificationMenu="nzDropdownMenu">
            <ul nz-menu class="dropdown-menu dropdown-menu-end show p-0 mt-2" style="min-width: 250px">
              <li *ngIf="notifications.length === 0" class="dropdown-item text-center text-muted">
                No notifications
              </li>
              <li
                *ngFor="let notification of notifications"
                class="dropdown-item"
              >
                {{ notification.title }}
              </li>
            </ul>
          </nz-dropdown-menu>

          <div class="user-info" style="cursor:pointer;" nz-dropdown nzTrigger="click" [nzDropdownMenu]="menu">
            <nz-avatar nzIcon="user" (click)="handleUserIconClick()"></nz-avatar>
            <span>{{ userName }}</span>
            <nz-dropdown-menu #menu="nzDropdownMenu">
              <ul nz-menu>
                <li (click)="logout()" nz-menu-item>Se déconnecter</li>
              </ul>
            </nz-dropdown-menu>
          </div>

        </div>

      </div>
    </nz-header>

    <nz-content>
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>

    </nz-content>
    <nz-footer>© 2025 Rapide Poste . Tous droits réservés.</nz-footer>

  </nz-layout>
</nz-layout>
