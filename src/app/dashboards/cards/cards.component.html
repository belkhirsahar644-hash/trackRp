<div style="background: #ECECEC; padding:30px;">
  <div *ngIf="isLoading">Chargement...</div>
  <div *ngIf="!isLoading">
  <div nz-row [nzGutter]="8">
    <div nz-col [nzSpan]="8">
      <nz-card nzTitle="Superviseurs" class="dashboard-card center-content" >
        <p>Total : {{ supervisorCount }}</p>
      </nz-card>
    </div>

    <div nz-col [nzSpan]="8">
      <nz-card nzTitle="Conducteurs" class="dashboard-card">
        <p>Total : {{ driverCount }}</p>
      </nz-card>
    </div>

    <div nz-col [nzSpan]="8">
      <nz-card nzTitle="Appareil" class="dashboard-card">
        <p>Total : {{ vehicleCount }}</p>

        <nz-dropdown-menu #menu="nzDropdownMenu">
          <ul nz-menu nzSelectable>

            <li nz-menu-item *ngFor="let device of installedDeviceNames" (click)="onDeviceSelected(device.id)">
              {{ device.id }}, {{ device.name }}
            </li>

          </ul>
        </nz-dropdown-menu>
        <p>  <a (click)="onClickInstaller()"> Appareil Installer :</a>
          <a nz-dropdown [nzDropdownMenu]="menu">
            {{ AppareilInstaller }}
            <nz-icon nzType="down" />
          </a></p>
      </nz-card>
    </div>
  </div>
  </div>
</div>
<div>
  <app-map-home [selectedDeviceId]="selectedDeviceId"
                [resetMapView]="resetMapView"
                (mapResetDone)="resetMapView = false">
  </app-map-home>

</div>
