<div style="background: #ECECEC; padding:30px;">
  <div nz-row [nzGutter]="8">
    <div nz-col [nzSpan]="8">
      <nz-card nzTitle="Superviseurs" class="dashboard-card center-content" >
        <p>Total : {{ supervisorCount }}</p>
      </nz-card>
    </div>

    <div nz-col [nzSpan]="8">
      <nz-card nzTitle="Conducteurs" class="dashboard-card">
        <p>Total : {{ driverCount }}</p>
      </nz-card>
    </div>

    <div nz-col [nzSpan]="8">
      <nz-card nzTitle="Appareil" class="dashboard-card">
        <p>Total : {{ deviceCount }}</p>

        <nz-dropdown-menu #menu="nzDropdownMenu">
          <ul nz-menu nzSelectable>

            <li nz-menu-item *ngFor="let device of installedDevice" (click)="onDeviceSelected(device)">
              {{ device.id }}, {{ device.name }}
            </li>

          </ul>
        </nz-dropdown-menu>
        <p>  <a (click)="onClickInstaller()"> Appareil Installer :</a>
          <a nz-dropdown [nzDropdownMenu]="menu">
            {{ AppareilInstaller }}
            <nz-icon nzType="down" />
          </a></p>
      </nz-card>
    </div>
  </div>
  </div>

<div>
  <div class="row">
    <div class="col-3">
      Appareil sélectionné :
    </div>
    <div class="col-3">
      <nz-select [(ngModel)]="selectedDevice">
        <nz-option nzValue="" nzLabel=""></nz-option>
        <nz-option  *ngFor="let device of installedDevice" (click)="onDeviceSelected(device)"
                    [nzValue]="device" [nzLabel]="device.name"></nz-option>
      </nz-select>
    </div>
    <div class="col-3" *ngIf="selectedDevice">
      <a (click)="markZone()">Marquer une zone geofence</a>
    </div>
    <div class="col-3" *ngIf="selectedDevice">
      <a (click)="confirmZone()">confirmer</a>
    </div>
  </div>
  <app-map-home [selectedDeviceId]="selectedDevice?.id"
                [resetMapView]="reinitialiserMap"
                (mapMarkerLocEvent)="updateMarkerLoc($event)"
                (mapResetDone)="reinitialiserMap = false">
  </app-map-home>

</div>
