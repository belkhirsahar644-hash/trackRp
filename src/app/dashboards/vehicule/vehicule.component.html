<div class=" d-flex justify-content-between">
  <h3>Liste des Véhicules</h3>
  <button nz-button nzType="dashed" (click)="toggleForm()">Ajouter</button>
  <br/><br/>
</div>

<nz-table #nzTable [nzData]="listOfDisplayData" nzTableLayout="fixed">
  <thead>
  <tr>
    <th nzCustomFilter>
      Identifiant
      <nz-filter-trigger [(nzVisible)]="visible" [nzActive]="searchValue.length > 0" [nzDropdownMenu]="menu">
        <nz-icon nzType="search"/>
      </nz-filter-trigger>
    </th>
    <th>Marque</th>
    <th>Modèle</th>
    <th nzCellControl="action">Action</th>
  </tr>
  </thead>
  <tbody>
    @for (data of nzTable.data; track data.id) {
      <tr>
        <td>{{ data.uniqueId }}</td>
        <td>{{ data.name }}</td>
        <td>{{ data.model }}</td>
        <td nzCellControl="action">
          <button nz-button nzType="dashed" (click)="editVehicle(data)"> Modifier</button>
          <nz-divider nzType="vertical"></nz-divider>
          <button
            nz-button
            nz-popconfirm
            nzPopconfirmTitle="Voulez vous vraiment supprimer ?"
            nzPopconfirmPlacement="bottom"
            nzType="dashed"
            (nzOnConfirm)="deleteVehicle(data)">
            Supprimer
          </button>
          <nz-divider nzType="vertical"></nz-divider>
          <button nz-button nzType="dashed" [routerLink]="['/map', data.id]">Map</button>
      </tr>
    }
  </tbody>
</nz-table>
<nz-dropdown-menu #menu="nzDropdownMenu">
  <div class="ant-table-filter-dropdown">
    <div class="search-box">
      <input type="text" nz-input placeholder="Search car registration number" [(ngModel)]="searchValue"/>
      <button nz-button nzSize="small" nzType="primary" (click)="search()" class="search-button">Search</button>
      <button nz-button nzSize="small" (click)="reset()">Reset</button>
    </div>
  </div>
</nz-dropdown-menu>
<div *ngIf="showForm">
  <app-add-vehicule [isVisibleV]="showForm" [device]="selectedDevice" (addEvent)="loadVehicule(); showForm=false "
                    (cancelEvent)="showForm = false"></app-add-vehicule>
</div>
