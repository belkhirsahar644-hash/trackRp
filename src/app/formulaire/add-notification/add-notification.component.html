<nz-modal [(nzVisible)]="isVisibleF"
          nzTitle="Ajouter une notification"
          (nzOnCancel)="handleCancel()"
          (nzOnOk)="handleOk()"
          [nzOkDisabled]="!validateForm.valid"
          nzOkText="Ajouter"
          nzCancelText="Annuler">

  <ng-container *nzModalContent>
    <!--formulaire-->
    <form nz-form [formGroup]="validateForm" (ngSubmit)="submitForm()">
      <nz-form-item>
        <nz-form-label [nzSpan]="5" >Description</nz-form-label>
        <nz-form-control [nzSpan]="12" >
          <input id="description" type="text" nz-input formControlName="description"  />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label [nzSpan]="5" nzFor="type" nzRequired>Type</nz-form-label>
        <nz-form-control [nzSpan]="12" nzErrorTip="Ajouter le type ">
          <nz-select id="type" formControlName="type" nzPlaceHolder="Type du notification">
            <nz-option nzValue="deviceOnline" nzLabel="Statut en ligne"></nz-option>
            <nz-option nzValue="deviceUnknown" nzLabel="Statut inconnu"></nz-option>
            <nz-option nzValue="deviceOffline" nzLabel="Statut hors ligne"></nz-option>
            <nz-option nzValue="deviceInactive" nzLabel="Appareil inactif"></nz-option>
            <nz-option nzValue="deviceMoving" nzLabel="Déplacement de l'appareil"></nz-option>
            <nz-option nzValue="deviceStopped" nzLabel="Appareil arrêté"></nz-option>
            <nz-option nzValue="deviceOverspeed" nzLabel="Limite de vitesse dépassée"></nz-option>
            <nz-option nzValue="geofenceEnter" nzLabel="Entré du zone géofence"></nz-option>
            <nz-option nzValue="geofenceExit" nzLabel="Sortie de du zone géofence"></nz-option>

          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </form>


  </ng-container>
</nz-modal>
