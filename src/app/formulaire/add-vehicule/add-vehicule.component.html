<nz-modal [(nzVisible)]="isVisibleV"
nzTitle="{{device.id ? 'Modifier' : 'Ajouter'}} un véhicule"
(nzOnCancel)="handleCancel()"
(nzOnOk)="handleOk()"
          [nzOkDisabled]="VehiculForm.invalid"
nzOkText="{{device.id ? 'Modifier' : 'Ajouter'}}"
nzCancelText="Annuler">

<ng-container *nzModalContent>
  <!--formulaire-->
  <form nz-form  [formGroup]="VehiculForm" >
    <nz-form-item>
      <nz-form-label [nzSpan]="7"  nzRequired >Identifiant</nz-form-label>
      <nz-form-control [nzSpan]="12" [nzErrorTip]="'Identifiant requis'"   nzValidatingTip="Validating...">
        <input nz-input formControlName="uniqueId" placeholder="Identifiant" />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSpan]="7" nzRequired>Marque</nz-form-label>
      <nz-form-control [nzSpan]="12">
        <input nz-input formControlName="name" placeholder="Marque" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="7" nzRequired>Modéle</nz-form-label>
      <nz-form-control [nzSpan]="12">
        <input nz-input formControlName="model" placeholder="Modéle" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="7" >Nom du conducteur</nz-form-label>
      <nz-form-control [nzSpan]="12">
        <input nz-input formControlName="nameDriver" placeholder="Nom du conducteur" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="7" >Limite de vitesse </nz-form-label>
      <nz-form-control [nzSpan]="12">
        <input nz-input formControlName="speedLimit" placeholder="Limite de vitesse" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="7" >Seuil perte de carburant </nz-form-label>
      <nz-form-control [nzSpan]="12">
        <input nz-input formControlName="fuelDropThreshold" placeholder="Seuil perte de carburant" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="7" >Seuil ajout de carburant </nz-form-label>
      <nz-form-control [nzSpan]="12">
        <input nz-input formControlName="fuelIncreaseThreshold" placeholder="Seuil ajout de carburant" />
      </nz-form-control>
    </nz-form-item>


  </form>
</ng-container>
</nz-modal>
