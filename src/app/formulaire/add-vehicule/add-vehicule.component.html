<div class="container">
  <h2>{{device.id ? 'modifier' : 'Ajouter'}} un véhicule</h2>

  <form #f="ngForm" (submit)="addveh();">

    <label for="uniqueId">Matricule:</label>
    <input type="text" [(ngModel)]="device.uniqueId" name="uniqueId" required #name="ngModel">
    {{name.valid ? '': 'Matricule est obligatoire'}}
    <label for="name">Marque :</label>
    <input type="text" [(ngModel)]="device.name" name="name" required>

    <label for="model">Modéle :</label>
    <input type="text" [(ngModel)]="device.model" name="model" required>

    <button id="btnsubmit" type="submit" [disabled]="!f.form.valid">Ajouter</button>
  </form>


  <p *ngIf="message">{{ message }}</p>
</div>
