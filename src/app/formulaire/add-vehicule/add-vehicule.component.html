<nz-modal [(nzVisible)]="isVisibleV"
nzTitle="{{device.id ? 'Modifier' : 'Ajouter'}} un véhicule"
(nzOnCancel)="handleCancel()"
(nzOnOk)="handleOk()"
          [nzOkDisabled]="!VehiculForm.valid"
nzOkText="{{device.id ? 'Modifier' : 'Ajouter'}}"
nzCancelText="Annuler">

<ng-container *nzModalContent>
  <!--formulaire-->
  <form nz-form  [formGroup]="VehiculForm" >
    <nz-form-item>
      <nz-form-label [nzSpan]="7" nzRequired>Matricule</nz-form-label>
      <nz-form-control [nzSpan]="12" nzValidatingTip="Validating...">
        <input nz-input formControlName="uniqueId" placeholder="Matricule" />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSpan]="7" nzRequired>Marque</nz-form-label>
      <nz-form-control [nzSpan]="12">
        <input nz-input formControlName="name" placeholder="Marque" />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSpan]="7" nzRequired>Modéle</nz-form-label>
      <nz-form-control [nzSpan]="12">
        <input nz-input formControlName="model" placeholder="Modéle" />
      </nz-form-control>
    </nz-form-item>
  </form>
</ng-container>
</nz-modal>
