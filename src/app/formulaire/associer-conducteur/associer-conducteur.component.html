<nz-modal
  [nzVisible]="isVisibleLink"
  [nzClosable]="true"
  [nzMaskClosable]="false"
  [nzOkLoading]="step === 2 ? false : false"
[nzFooter]="null"
(nzOnCancel)="handleCancel()"
nzTitle="{{ step === 1 ? 'Associer à un conducteur' : 'Associer à un superviseur' }}"
>

<ng-container *nzModalContent>
<p>Associer un conducteur à l'appareil avec ID : {{ deviceId }}</p>
    <nz-radio-group  [(ngModel)]="selectedUserId">
      <div *ngFor="let user of utilisateursAffiches">

      <label nz-radio [nzValue]="user.id">
          {{ user.id }} {{ user.email }}
        </label>
      </div>
    </nz-radio-group>

  <div class="footer-buttons" style="margin-top: 20px; text-align: right">
    <button nz-button (click)="handleCancel()">Annuler</button>
    <button nz-button nzType="primary" (click)="handleOk()">
      {{ step === 1 ? 'Next' : 'Terminer' }}
    </button>
  </div>
  </ng-container>
</nz-modal>
