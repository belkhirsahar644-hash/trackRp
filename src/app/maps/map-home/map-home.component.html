<div class="map-wrap">
  <a href="https://www.maptiler.com" class="watermark">
    <img src="https://api.maptiler.com/resources/logo.svg" alt="MapTiler logo" />
  </a>
  <div class="map" #map></div>
</div>

<app-device-modal
  [Modalvisible]="modalVisible"
  [position]="selectedPosition"
  (close)="handleCancel()"
  (openGeofence)="handleOpenGeofence()"
>

</app-device-modal>

<app-geofence
  *ngIf="geofenceDrawerVisible && selectedDevice"
  [visible]="geofenceDrawerVisible"
  [device]="selectedDevice"

  (closeDrawer)="geofenceDrawerVisible = false">
</app-geofence>
